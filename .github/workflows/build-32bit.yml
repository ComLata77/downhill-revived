name: Build Android 32-bit APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build APK dengan Gradle
      run: |
          chmod +x gradlew
          ./gradlew assembleDebug -Pandroid.injected.build.abi=armeabi-v7a -Pandroid.ndkDirectory=$ANDROID_NDK_LATEST_HOME
          
          
          
    - name: Upload Hasil APK 32-bit
      uses: actions/upload-artifact@v4
      with:
        name: Downhill-32bit-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        
