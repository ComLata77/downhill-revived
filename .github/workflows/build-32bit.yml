name: Build Android 32-bit APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build APK via Python Script
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
          ANDROID_USER_HOME: ${{ github.workspace }}/.android
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          mkdir -p ${{ github.workspace }}/.gradle
          mkdir -p ${{ github.workspace }}/.android
          PYTHON_SCRIPT=$(find . -name "build_apk.py" | head -n 1)
          if [ -z "$PYTHON_SCRIPT" ]; then
            echo "Error: File build_apk.py tidak ditemukan di repositori!"
            exit 1
          fi
          SCRIPT_DIR=$(dirname "$PYTHON_SCRIPT")
          cd "$SCRIPT_DIR"
          python build_apk.py

      - name: Upload Hasil APK 32-bit
        uses: actions/upload-artifact@v4
        with:
          name: Downhill-32bit-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          
