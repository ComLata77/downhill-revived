name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build APK via Python Script
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
          ANDROID_USER_HOME: ${{ github.workspace }}/.android
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          mkdir -p ${{ github.workspace }}/.gradle
          mkdir -p ${{ github.workspace }}/.android
          
          # Trik Membuat Folder Tiruan Windows NDK agar Compiler Linux Bisa Berjalan
          NDK_VERSION_DIR="/usr/local/lib/android/sdk/ndk/27.3.13750724"
          WIN_BIN_DIR="$NDK_VERSION_DIR/toolchains/llvm/prebuilt/windows-x86_64/bin"
          LINUX_CLANG="$NDK_VERSION_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          
          sudo mkdir -p "$WIN_BIN_DIR"
          
          # Buat jalan pintas (shortcut) dari clang.exe tiruan ke clang Linux asli
          if [ -f "$LINUX_CLANG" ]; then
            sudo ln -sf "$LINUX_CLANG" "$WIN_BIN_DIR/clang.exe"
            sudo ln -sf "$LINUX_CLANG"++ "$WIN_BIN_DIR/clang++.exe"
            echo "Sukses membuat tiruan compiler Windows untuk Linux!"
          fi
          
          # Cari letak skrip Python pembangun
          PYTHON_SCRIPT=$(find . -name "build_apk.py" | head -n 1)
          if [ -z "$PYTHON_SCRIPT" ]; then
            echo "Error: File build_apk.py tidak ditemukan di repositori!"
            exit 1
          fi
          SCRIPT_DIR=$(dirname "$PYTHON_SCRIPT")
          cd "$SCRIPT_DIR"
          
          # Jalankan skrip bawaan proyek
          python build_apk.py

      - name: Upload Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: Downhill-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          
